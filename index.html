<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RH Digital</title>
<script src="https://accounts.google.com/gsi/client" async defer onload="onGsiLoad()"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --navy-950:#060e1f;
    --navy-900:#0a1830;
    --navy-800:#0f2140;
    --navy-700:#16305a;
    --navy-600:#1e3d6e;
    --gold-500:#d4af37;
    --gold-400:#e6c667;
    --gold-300:#f0d998;
    --white:#ffffff;
    --off-white:#f4f6fa;
    --muted:#a9b6cf;
    --muted-dark:#4b5b78;
    --border-light:#e2e6f0;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--off-white); color: var(--navy-900); margin: 0; }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; }
  button { cursor: pointer; font-family: 'Inter', sans-serif; }
  input, select, textarea { font-family: 'IBM Plex Mono', monospace; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  .btn-primary { padding: 9px 18px; border-radius: 6px; border: none; background: linear-gradient(135deg, var(--gold-400), var(--gold-500)); color: var(--navy-950); font-weight: 600; font-size: 13px; transition: box-shadow 0.15s ease, transform 0.1s ease; }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 10px 20px -6px rgba(212,175,55,.55); transform: translateY(-1px); }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { background: var(--muted); }
  .btn-outline { font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--navy-900); background: transparent; color: var(--navy-900); transition: background 0.15s ease; }
  .btn-outline:hover { background: rgba(10,24,48,.06); }
  .btn-danger { font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid #e24b4a; background: transparent; color: #a32d2d; transition: background 0.15s ease; }
  .btn-danger:hover { background: #fbeaea; }
  .doc-row { transition: box-shadow 0.15s ease; }
  .doc-row:hover { box-shadow: 0 2px 8px rgba(10,24,48,0.08); }
  .layout-grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .search-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  @media (max-width: 720px) {
    .wrap { padding: 16px 12px 40px; }
    .layout-grid { grid-template-columns: 1fr; }
    .form-grid-2 { grid-template-columns: 1fr; }
    .search-grid { grid-template-columns: 1fr; }
    h1 { font-size: 21px !important; }
    .doc-row { flex-direction: column; align-items: flex-start !important; gap: 10px !important; }
    .doc-row > div:last-child { width: 100%; display: flex; }
    .doc-row > div:last-child button { flex: 1; }
    .tab-btn { flex: 1; }
  }
  .field { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-light); font-size: 14px; background: var(--white); color: var(--navy-900); }
  .label { font-size: 12px; font-weight: 600; color: var(--muted-dark); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.03em; }
  .card { background: var(--white); border: 1px solid var(--border-light); border-radius: 10px; padding: 16px; }
  .stamp { display: inline-block; border: 2px solid #b45309; color: #b45309; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; transform: rotate(-2deg); text-transform: uppercase; }
  .folder-tab { padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; color: var(--off-white); }
  .folder-tab:hover { background: var(--navy-800); }
  .folder-tab.active { background: var(--gold-500); color: var(--navy-950); }
  .tab-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--navy-900); background: transparent; color: var(--navy-900); font-weight: 600; font-size: 13px; }
  .tab-btn.active { background: var(--navy-900); color: var(--gold-300); border-color: var(--navy-900); }
  .doc-row { background: var(--white); border: 1px solid var(--border-light); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .error-box { background: #fbeaf0; color: #72243e; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
const APP_VERSION = '1.5';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const USERINFO_SCOPE = 'https://www.googleapis.com/auth/userinfo.email';
const TIPOS = ["Atestado médico", "Declaração de comparecimento", "Declaração escolar", "Outro"];

const state = {
  screen: 'config',
  clientId: localStorage.getItem('pf_client_id') || '',
  adminEmail: localStorage.getItem('pf_admin_email') || '',
  userEmail: '',
  tokenClient: null,
  accessToken: null,
  tokenExpiry: 0,
  folderId: null,
  dataFileId: null,
  deletedRootFolderId: null,
  monthFolderCache: {},
  employees: [],
  docs: [],
  tab: 'funcionarios',
  selectedEmp: null,
  editingEmp: null,
  editForm: null,
  error: '',
  loading: false,
  saving: false,
  docForm: { tipo: TIPOS[0], tipoOutro: '', motivo: '', data: '', files: [], error: '' },
  empFormError: '',
  newEmpForm: { nome: '', cpf: '', cargo: '' },
  search: { emp: '', tipo: '', texto: '', de: '', ate: '' },
  searchPage: 1,
};

function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function formatDate(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y; }
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

function setError(msg) { state.error = msg; render(); }

async function driveFetch(url, options = {}) {
  if (!state.accessToken) throw new Error('Não autenticado');
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + state.accessToken;
  let res = await fetch(url, options);
  if (res.status === 401) {
    await refreshToken();
    options.headers['Authorization'] = 'Bearer ' + state.accessToken;
    res = await fetch(url, options);
  }
  return res;
}

function refreshToken() {
  return new Promise((resolve, reject) => {
    state.tokenClient.callback = (resp) => {
      if (resp.error) { reject(resp); return; }
      state.accessToken = resp.access_token;
      resolve();
    };
    state.tokenClient.requestAccessToken({ prompt: '' });
  });
}

function initGoogle() {
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.clientId,
    scope: DRIVE_SCOPE + ' ' + USERINFO_SCOPE,
    callback: async (resp) => {
      if (resp.error) { state.screen = 'config'; setError('Falha ao autenticar com o Google: ' + resp.error); return; }
      state.accessToken = resp.access_token;
      await fetchUserInfo();
      state.screen = 'app';
      state.loading = true;
      render();
      try {
        await ensureFolderAndData();
      } catch (e) {
        setError('Erro ao acessar o Google Drive: ' + e.message);
      }
      state.loading = false;
      render();
    }
  });
  state.tokenClient.requestAccessToken({ prompt: 'consent' });
}

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
}

function onGsiLoad() {
  if (state.clientId && !isMobileDevice()) {
    attemptSilentConnect();
  } else {
    if (state.clientId) state.screen = 'config';
    render();
  }
}

function attemptSilentConnect() {
  state.screen = 'connecting';
  render();
  let settled = false;
  const timeoutId = setTimeout(() => {
    if (!settled) {
      settled = true;
      state.screen = 'config';
      render();
    }
  }, 3500);
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.clientId,
    scope: DRIVE_SCOPE + ' ' + USERINFO_SCOPE,
    callback: async (resp) => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      if (resp.error) { state.screen = 'config'; render(); return; }
      state.accessToken = resp.access_token;
      await fetchUserInfo();
      state.screen = 'app';
      state.loading = true;
      render();
      try {
        await ensureFolderAndData();
      } catch (e) {
        setError('Erro ao acessar o Google Drive: ' + e.message);
      }
      state.loading = false;
      render();
    }
  });
  state.tokenClient.requestAccessToken({ prompt: '' });
}

async function fetchUserInfo() {
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + state.accessToken }
    });
    if (res.ok) {
      const j = await res.json();
      state.userEmail = j.email || '';
    }
  } catch (e) {}
}

function canDelete() {
  if (!state.adminEmail) return true;
  return state.userEmail && state.userEmail.toLowerCase() === state.adminEmail.toLowerCase();
}

function disconnect() {
  state.accessToken = null;
  state.userEmail = '';
  state.employees = [];
  state.docs = [];
  state.selectedEmp = null;
  state.screen = 'config';
  render();
}

async function ensureFolderAndData() {
  let res = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='PastaFuncional' and trashed=false") + "&fields=files(id,name)");
  let json = await res.json();
  if (json.files && json.files.length > 0) {
    state.folderId = json.files[0].id;
  } else {
    res = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'PastaFuncional', mimeType: 'application/vnd.google-apps.folder' })
    });
    json = await res.json();
    state.folderId = json.id;
  }

  res = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("'" + state.folderId + "' in parents and name='dados.json' and trashed=false") + "&fields=files(id,name)");
  json = await res.json();
  if (json.files && json.files.length > 0) {
    state.dataFileId = json.files[0].id;
    res = await driveFetch("https://www.googleapis.com/drive/v3/files/" + state.dataFileId + "?alt=media");
    const data = await res.json();
    state.employees = data.employees || [];
    state.docs = data.docs || [];
  } else {
    const initial = { employees: [], docs: [] };
    res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=pfboundary' },
      body: "--pfboundary\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
            JSON.stringify({ name: 'dados.json', parents: [state.folderId] }) + "\r\n" +
            "--pfboundary\r\nContent-Type: application/json\r\n\r\n" +
            JSON.stringify(initial) + "\r\n--pfboundary--"
    });
    json = await res.json();
    state.dataFileId = json.id;
    state.employees = [];
    state.docs = [];
  }
}

async function saveData() {
  const res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + state.dataFileId + "?uploadType=media", {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ employees: state.employees, docs: state.docs })
  });
  if (!res.ok) throw new Error('Falha ao salvar dados no Drive');
}

function buildMultipartBody(metadata, file) {
  const boundary = 'pfboundary';
  const head = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
               JSON.stringify(metadata) + "\r\n--" + boundary + "\r\nContent-Type: " + file.type + "\r\n\r\n";
  const tail = "\r\n--" + boundary + "--";
  return new Blob([head, file, tail]);
}

async function uploadAttachment(file, docId, employee) {
  const empPart = employee ? slugify(employee.nome) + (employee.cpf ? '_' + onlyDigits(employee.cpf) : '') : 'funcionario';
  const metadata = { name: empPart + '_' + docId + '_' + file.name, parents: [state.folderId] };
  const body = buildMultipartBody(metadata, file);
  const res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=pfboundary' },
    body
  });
  if (!res.ok) throw new Error('Falha ao enviar arquivo ao Drive');
  return res.json();
}

async function ensureDeletedMonthFolder() {
  if (!state.deletedRootFolderId) {
    let res = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("'" + state.folderId + "' in parents and name='Itens excluídos' and mimeType='application/vnd.google-apps.folder' and trashed=false") + "&fields=files(id,name)");
    let json = await res.json();
    if (json.files && json.files.length > 0) {
      state.deletedRootFolderId = json.files[0].id;
    } else {
      res = await driveFetch("https://www.googleapis.com/drive/v3/files", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'Itens excluídos', mimeType: 'application/vnd.google-apps.folder', parents: [state.folderId] })
      });
      json = await res.json();
      state.deletedRootFolderId = json.id;
    }
  }

  const now = new Date();
  const monthLabel = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  if (!state.monthFolderCache) state.monthFolderCache = {};
  if (state.monthFolderCache[monthLabel]) return state.monthFolderCache[monthLabel];

  let res = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("'" + state.deletedRootFolderId + "' in parents and name='" + monthLabel + "' and mimeType='application/vnd.google-apps.folder' and trashed=false") + "&fields=files(id,name)");
  let json = await res.json();
  let monthFolderId;
  if (json.files && json.files.length > 0) {
    monthFolderId = json.files[0].id;
  } else {
    res = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: monthLabel, mimeType: 'application/vnd.google-apps.folder', parents: [state.deletedRootFolderId] })
    });
    json = await res.json();
    monthFolderId = json.id;
  }
  state.monthFolderCache[monthLabel] = monthFolderId;
  return monthFolderId;
}

async function deleteAttachment(fileId) {
  try {
    const monthFolderId = await ensureDeletedMonthFolder();
    await driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?addParents=" + monthFolderId + "&removeParents=" + state.folderId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
  } catch (e) {}
}

function cpfExists(cpf, excludeId) {
  const digits = onlyDigits(cpf);
  if (!digits) return false;
  return state.employees.some(e => e.id !== excludeId && onlyDigits(e.cpf) === digits);
}

async function addEmployee(nome, cpf, cargo) {
  nome = nome.trim();
  cpf = (cpf || '').trim();
  state.empFormError = '';
  if (!nome) return;
  if (cpf && !isValidCpf(cpf)) {
    state.empFormError = 'CPF inválido. Confira os números digitados.';
    render();
    return;
  }
  if (cpf && cpfExists(cpf, null)) {
    state.empFormError = 'Já existe um funcionário cadastrado com esse CPF.';
    render();
    return;
  }
  const cpfFormatted = cpf ? formatCpf(cpf) : '';
  const emp = { id: uid('emp'), nome, cpf: cpfFormatted, cargo: cargo.trim() };
  state.employees.push(emp);
  state.employees.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  try {
    await saveData();
    state.selectedEmp = emp.id;
    state.newEmpForm = { nome: '', cpf: '', cargo: '' };
  } catch (e) { setError('Não foi possível cadastrar o funcionário.'); }
  render();
}

function startEditEmployee(id) {
  const e = state.employees.find(e => e.id === id);
  if (!e) return;
  state.editingEmp = id;
  state.editForm = { nome: e.nome, cpf: e.cpf || '', cargo: e.cargo || '', error: '' };
  render();
}

function cancelEditEmployee() {
  state.editingEmp = null;
  state.editForm = null;
  render();
}

async function saveEditEmployee() {
  const ef = state.editForm;
  const nome = (ef.nome || '').trim();
  const cpf = (ef.cpf || '').trim();
  const cargo = (ef.cargo || '').trim();
  ef.error = '';
  if (!nome) { ef.error = 'Informe o nome.'; render(); return; }
  if (cpf && !isValidCpf(cpf)) { ef.error = 'CPF inválido. Confira os números digitados.'; render(); return; }
  if (cpf && cpfExists(cpf, state.editingEmp)) { ef.error = 'Já existe outro funcionário cadastrado com esse CPF.'; render(); return; }
  const emp = state.employees.find(e => e.id === state.editingEmp);
  if (!emp) { cancelEditEmployee(); return; }
  emp.nome = nome;
  emp.cpf = cpf ? formatCpf(cpf) : '';
  emp.cargo = cargo;
  state.employees.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  try {
    await saveData();
    state.editingEmp = null;
    state.editForm = null;
  } catch (e) {
    ef.error = 'Não foi possível salvar as alterações.';
  }
  render();
}

async function deleteEmployee(id) {
  if (!confirm('Remover este funcionário? Os documentos anexados continuam salvos no Drive mas ficam sem funcionário vinculado visível.')) return;
  state.employees = state.employees.filter(e => e.id !== id);
  try { await saveData(); if (state.selectedEmp === id) state.selectedEmp = null; } catch (e) { setError('Não foi possível remover o funcionário.'); }
  render();
}

function onlyDigits(s) { return (s || '').toString().replace(/\D/g, ''); }

function formatCpf(v) {
  v = onlyDigits(v).slice(0, 11);
  if (v.length <= 3) return v;
  if (v.length <= 6) return v.slice(0,3) + '.' + v.slice(3);
  if (v.length <= 9) return v.slice(0,3) + '.' + v.slice(3,6) + '.' + v.slice(6);
  return v.slice(0,3) + '.' + v.slice(3,6) + '.' + v.slice(6,9) + '-' + v.slice(9);
}

function isValidCpf(cpf) {
  const s = onlyDigits(cpf);
  if (s.length !== 11 || /^(\d)\1{10}$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += parseInt(s[i]) * (10 - i);
  let rev = 11 - (sum % 11);
  if (rev >= 10) rev = 0;
  if (rev !== parseInt(s[9])) return false;
  sum = 0;
  for (let i = 0; i < 10; i++) sum += parseInt(s[i]) * (11 - i);
  rev = 11 - (sum % 11);
  if (rev >= 10) rev = 0;
  if (rev !== parseInt(s[10])) return false;
  return true;
}

function slugify(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

async function importEmployeesFile(file) {
  if (!file) return;
  state.importMsg = 'Lendo planilha...';
  render();
  try {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

    const existingCpfs = new Set(state.employees.filter(e => e.cpf).map(e => onlyDigits(e.cpf)));
    const existingNames = new Set(state.employees.map(e => e.nome.trim().toLowerCase()));

    let added = 0, skipped = 0;
    for (const row of rows) {
      const keys = Object.keys(row);
      const nomeKey = keys.find(k => k.trim().toLowerCase() === 'nome');
      const cpfKey = keys.find(k => k.trim().toLowerCase() === 'cpf');
      const cargoKey = keys.find(k => k.trim().toLowerCase() === 'cargo');
      const nome = nomeKey ? String(row[nomeKey]).trim() : '';
      const cpf = cpfKey ? String(row[cpfKey]).trim() : '';
      const cargo = cargoKey ? String(row[cargoKey]).trim() : '';
      if (!nome) { continue; }
      if (cpf && !isValidCpf(cpf)) { skipped++; continue; }
      const cpfFormatted = cpf ? formatCpf(cpf) : '';
      const cpfDigits = onlyDigits(cpf);
      if ((cpfDigits && existingCpfs.has(cpfDigits)) || (!cpfDigits && existingNames.has(nome.toLowerCase()))) {
        skipped++;
        continue;
      }
      state.employees.push({ id: uid('emp'), nome, cpf: cpfFormatted, cargo });
      if (cpfDigits) existingCpfs.add(cpfDigits);
      existingNames.add(nome.toLowerCase());
      added++;
    }
    state.employees.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    await saveData();
    state.importMsg = added + ' funcionário(s) importado(s)' + (skipped ? ', ' + skipped + ' ignorado(s) por já existirem' : '') + '.';
  } catch (e) {
    state.importMsg = '';
    setError('Não foi possível importar a planilha. Verifique se tem colunas "Nome" e "CPF".');
    return;
  }
  render();
}

function resetDocForm() { state.docForm = { tipo: TIPOS[0], tipoOutro: '', motivo: '', data: '', files: [], error: '' }; }

async function handleAddDocument(employeeId) {
  const f = state.docForm;
  f.error = '';
  const tipoFinal = f.tipo === 'Outro' ? f.tipoOutro.trim() : f.tipo;
  if (!tipoFinal) { f.error = 'Informe o tipo do documento.'; render(); return; }
  if (!f.motivo.trim()) { f.error = 'O motivo é obrigatório.'; render(); return; }
  if (!f.data) { f.error = 'A data é obrigatória.'; render(); return; }
  if (!f.files || f.files.length === 0) { f.error = 'Anexe ao menos um arquivo PDF ou JPEG.'; render(); return; }
  for (const file of f.files) {
    const isPdf = file.type === 'application/pdf';
    const isJpeg = file.type === 'image/jpeg' || file.type === 'image/jpg';
    if (!isPdf && !isJpeg) { f.error = 'Só é permitido anexar arquivos PDF ou JPEG ("' + file.name + '" não é válido).'; render(); return; }
    if (file.size > 400 * 1024) { f.error = 'O arquivo "' + file.name + '" tem ' + Math.round(file.size/1024) + ' KB. O limite é de 400 KB por arquivo.'; render(); return; }
  }

  state.saving = true; render();
  try {
    const employee = state.employees.find(e => e.id === employeeId);
    const newEntries = [];
    for (const file of f.files) {
      const docId = uid('doc');
      const isPdf = file.type === 'application/pdf';
      const uploaded = await uploadAttachment(file, docId, employee);
      newEntries.push({
        id: docId, employeeId, tipo: tipoFinal, motivo: f.motivo.trim(), data: f.data,
        arquivoNome: file.name, arquivoTipo: isPdf ? 'pdf' : 'jpeg',
        driveFileId: uploaded.id, webViewLink: uploaded.webViewLink,
        criadoEm: new Date().toISOString()
      });
    }
    state.docs = [...newEntries.reverse(), ...state.docs];
    await saveData();
    resetDocForm();
  } catch (e) {
    f.error = 'Não foi possível salvar um ou mais documentos. Tente novamente.';
  }
  state.saving = false;
  render();
}

async function deleteDocument(docId) {
  if (!confirm('Excluir este documento? O arquivo será movido para a pasta "Itens excluídos" (organizada por mês) dentro do PastaFuncional no Drive, não fica mais visível aqui no sistema.')) return;
  const doc = state.docs.find(d => d.id === docId);
  state.docs = state.docs.filter(d => d.id !== docId);
  try {
    await saveData();
    if (doc && doc.driveFileId) await deleteAttachment(doc.driveFileId);
  } catch (e) { setError('Não foi possível excluir o documento.'); }
  render();
}

function viewDocument(doc) {
  if (doc.webViewLink) window.open(doc.webViewLink, '_blank');
}

function employeeName(id) {
  const e = state.employees.find(e => e.id === id);
  return e ? e.nome : 'Funcionário removido';

function employeeLabel(id) {
  const e = state.employees.find(e => e.id === id);
  if (!e) return 'Funcionário removido';
  return e.cpf ? e.nome + ' — ' + e.cpf : e.nome;
}

  const pageResults = results.slice((page - 1) * pageSize, page * pageSize);

  const empOptions = state.employees.map(e => `<option value="${e.id}" ${s.emp===e.id?'selected':''}>${esc(e.cpf ? e.nome + ' — ' + e.cpf : e.nome)}</option>`).join('');
  const tipoOptions = TIPOS.map(t => `<option value="${t}" ${s.tipo===t?'selected':''}>${t}</option>`).join('');
  const resultsHtml = pageResults.map(d => `
    <div class="doc-row">
      <div>
        <div style="font-weight:600;font-size:13px;">${esc(employeeLabel(d.employeeId))} — ${esc(d.tipo)} — ${formatDate(d.data)}</div>

  const pagination = totalPages > 1 ? `

      <button id="prevPageBtn" class="btn-outline" ${page <= 1 ? 'disabled style="opacity:0.4;"' : ''}>← Anterior</button>

  return `

    ${results.length === 0 ? '<div class="card" style="padding:30px;text-align:center;color:var(--muted-dark);">Nenhum documento encontrado para esses filtros.</div>' : resultsHtml}
    ${pagination}

  const docTipo = document.getElementById('docTipo');
  if (docTipo) docTipo.onchange = () => { state.docForm.tipo = docTipo.value; render(); };
  const docTipoOutro = document.getElementById('docTipoOutro');
  if (docTipoOutro) docTipoOutro.oninput = () => { state.docForm.tipoOutro = docTipoOutro.value; };
  const docMotivo = document.getElementById('docMotivo');
  if (docMotivo) docMotivo.oninput = () => { state.docForm.motivo = docMotivo.value; };
  const docData = document.getElementById('docData');
  if (docData) docData.oninput = () => { state.docForm.data = docData.value; };
  const docFile = document.getElementById('docFile');
  const fileCountText = document.getElementById('fileCountText');
  if (docFile) docFile.onchange = () => {
    state.docForm.files = Array.from(docFile.files || []);
    if (fileCountText) {
      fileCountText.textContent = state.docForm.files.length
        ? state.docForm.files.map(fl => fl.name).join(', ')
        : 'Você pode selecionar vários arquivos de uma vez — todos serão salvos com o mesmo tipo, motivo e data.';
    }
  };
  const saveDocBtn = document.getElementById('saveDocBtn');
  if (saveDocBtn) saveDocBtn.onclick = () => handleAddDocument(state.selectedEmp);

  const sEmp = document.getElementById('sEmp');
  const sTipo = document.getElementById('sTipo');
  const sDe = document.getElementById('sDe');
  const sAte = document.getElementById('sAte');
  const sTexto = document.getElementById('sTexto');
  const searchDocsBtn = document.getElementById('searchDocsBtn');
  const doDocSearch = () => {
    state.search = {
      emp: sEmp ? sEmp.value : '',
      tipo: sTipo ? sTipo.value : '',
      texto: sTexto ? sTexto.value : '',
      de: sDe ? sDe.value : '',
      ate: sAte ? sAte.value : ''
    };
    state.searchPage = 1;
    render();
  };
  if (searchDocsBtn) searchDocsBtn.onclick = doDocSearch;
  if (sTexto) sTexto.onkeydown = (ev) => { if (ev.key === 'Enter') doDocSearch(); };
  const prevPageBtn = document.getElementById('prevPageBtn');
  if (prevPageBtn) prevPageBtn.onclick = () => { state.searchPage = Math.max(1, (state.searchPage || 1) - 1); render(); };
  const nextPageBtn = document.getElementById('nextPageBtn');
  if (nextPageBtn) nextPageBtn.onclick = () => { state.searchPage = (state.searchPage || 1) + 1; render(); };
}

if (state.clientId && !isMobileDevice()) {
  state.screen = 'connecting';
}
render();
</script>
</body>
</html>
